name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. FRONTEND CI: Lint, Type Check, Build, and Vitest TDD/TDS Suites
  # =========================================================================
  frontend-ci:
    name: Frontend (Lint, Build & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compile & Vite Production Build
        run: npm run build

      - name: Run Vitest Unit & Integration Suites (90/90 Tests)
        run: npm test

  # =========================================================================
  # 2. DOCKER COMPOSE CONFIG & SPEC VALIDATION
  # =========================================================================
  docker-compose-validation:
    name: Docker Compose Topology Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml Specification
        env:
          SECRET_KEY: ci-secret-key-verification-12345
          DATABASE_URL: postgresql+asyncpg://hip_admin:ci_pass@localhost:5432/hospital_intelligence
          POSTGRES_USER: hip_admin
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: hospital_intelligence
          REDIS_PASSWORD: ci_redis_pass
          INTERNAL_SERVICE_SECRET: ci-internal-secret
        run: |
          docker compose -f docker-compose.yml config

  # =========================================================================
  # 3. BACKEND MICROSERVICES CI: Python Lint, Dependencies & Unit Tests
  # =========================================================================
  backend-ci:
    name: Backend Microservices (Lint & Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/*/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r gateway/requirements.txt
          pip install -r services/auth-service/requirements.txt
          pip install -r services/bed-service/requirements.txt
          pip install -r services/patient-service/requirements.txt

      - name: Lint Codebase (PEP8 Syntax & Undefined Names)
        run: |
          flake8 services gateway --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services gateway --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Cryptography & Token Reset Unit Tests
        env:
          PYTHONPATH: services/auth-service
          SECRET_KEY: test-secret-key-for-ci-pipeline-1234567890
        run: |
          python test_password_reset_workflow.py

  # =========================================================================
  # 4. FULL-STACK INTEGRATION & CONCURRENCY TESTS (PostgreSQL + Redis + Gateway)
  #    Tests: Patient Service, Bed Service, Auth Service, DB Operations & RBAC
  # =========================================================================
  integration-e2e-ci:
    name: Full-Stack Integration (Postgres, Redis, RBAC & Concurrency)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Environment
        run: |
          # Create .env for docker compose stack
          cat << 'EOF' > .env
          POSTGRES_USER=hip_admin
          POSTGRES_PASSWORD=ci_password_123
          POSTGRES_DB=hospital_intelligence
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5431
          DATABASE_URL=postgresql+asyncpg://hip_admin:ci_password_123@hip-postgres:5432/hospital_intelligence
          SECRET_KEY=ci-secret-jwt-key-super-secure-32chars!!
          REDIS_PASSWORD=ci_redis_pass_123
          REDIS_URL=redis://:ci_redis_pass_123@hip-redis:6379
          INTERNAL_SERVICE_SECRET=ci-internal-service-secret-token-32
          GATEWAY_URL=http://localhost:8080
          TEST_PG_DSN=postgresql://hip_admin:ci_password_123@localhost:5431/hospital_intelligence
          TEST_USER_PASSWORD=SecurePassword123!
          EOF

      - name: Start Database, Cache, and Microservices Stack
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          # Poll gateway health
          for i in {1..30}; do
            if curl -s http://localhost:8080/health | grep -q "ok\|healthy\|online" || curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/beds/grid | grep -q "401\|200"; then
              echo "Gateway and backend services are ready!"
              break
            fi
            echo "Waiting for gateway on port 8080 ($i/30)..."
            sleep 2
          done

      - name: Setup Python for Integration Test Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Integration Test Client Dependencies
        run: |
          pip install httpx asyncpg python-dotenv

      - name: Execute End-to-End RBAC, DB Operations & Concurrency Test Suite
        env:
          GATEWAY_URL: http://localhost:8080
          TEST_PG_DSN: postgresql://hip_admin:ci_password_123@localhost:5431/hospital_intelligence
          TEST_USER_PASSWORD: SecurePassword123!
        run: |
          python test_concurrency_and_history.py

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100
