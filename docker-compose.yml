networks:
  hip-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # --- EDGE REVERSE PROXY, TLS & RATE LIMITER ---
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hip-nginx
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:80"
    environment:
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hip-network
    depends_on:
      gateway:
        condition: service_started

  # --- EDGE ROUTING LAYER ---
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hip-gateway
    expose:
      - "8000"
    environment:
      - ENV=production
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://hip-auth-service:8001}
      - PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:-http://hip-patient-service:8002}
      - BED_SERVICE_URL=${BED_SERVICE_URL:-http://hip-bed-service:8003}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-2097152}
      - RATE_LIMIT_AI_PER_MIN=${RATE_LIMIT_AI_PER_MIN:-20}
      - RATE_LIMIT_USER_PER_MIN=${RATE_LIMIT_USER_PER_MIN:-300}
      - RATE_LIMIT_ANON_AUTH_PER_MIN=${RATE_LIMIT_ANON_AUTH_PER_MIN:-60}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- AUTHENTICATION SERVICE ---
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hip-auth-service
    expose:
      - "8001"
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-noreply@hospital.org}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- PATIENT SERVICE ---
  patient-service:
    build: ./services/patient-service
    container_name: hip-patient-service
    expose:
      - "8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BED_SERVICE_URL=${BED_SERVICE_URL:-http://hip-bed-service:8003}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- BED SERVICE ---
  bed-service:
    build: ./services/bed-service
    container_name: hip-bed-service
    expose:
      - "8003"
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:-http://hip-patient-service:8002}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BED_RECOMMENDER_MODEL=${BED_RECOMMENDER_MODEL:-gemini-3.5-flash-lite}
      - BED_RECOMMENDER_TEMPERATURE=${BED_RECOMMENDER_TEMPERATURE:-0.1}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- DATABASE PERSISTENCE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: hip-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  # --- CACHING / SESSION LAYER ---
  redis:
    image: redis:7-alpine
    container_name: hip-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - hip-network

  # --- EMAIL TESTING INBOX (MAILPIT) ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: hip-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - hip-network

