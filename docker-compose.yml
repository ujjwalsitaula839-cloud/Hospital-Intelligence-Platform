networks:
  hip-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # --- EDGE ROUTING LAYER ---
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hip-gateway
    ports:
      - "8080:8000"  
    volumes:
      - ./gateway:/app
    environment:
      - ENV=development
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://hip-auth-service:8001}
      - PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:-http://hip-patient-service:8002}
      - BED_SERVICE_URL=${BED_SERVICE_URL:-http://hip-bed-service:8003}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- AUTHENTICATION SERVICE ---
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hip-auth-service
    expose:
      - "8001"  # Internal communication only
    volumes:
      - ./services/auth-service:/app
    environment:
      - ENV=development
      - DATABASE_URL=${DATABASE_URL} 
      - SECRET_KEY=${SECRET_KEY}      
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- PATIENT SERVICE ---
  patient-service:
    build: ./services/patient-service
    container_name: hip-patient-service
    expose:
      - "8002" 
    volumes:
      - ./services/patient-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      - DATABASE_URL=${DATABASE_URL}  
      - BED_SERVICE_URL=${BED_SERVICE_URL:-http://hip-bed-service:8003}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- BED SERVICE ---
  bed-service:
    build: ./services/bed-service
    container_name: hip-bed-service
    expose:
      - "8003" 
    volumes:
      - ./services/bed-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}  
      - PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:-http://hip-patient-service:8002}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- DATABASE PERSISTENCE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: hip-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  # --- CACHING / SESSION LAYER ---
  redis:
    image: redis:7-alpine
    container_name: hip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hip-network
