networks:
  hip-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # --- EDGE ROUTING LAYER ---
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hip-gateway
    ports:
      - "8080:8000"
    environment:
      - ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://hip-auth-service:8001}
      - PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:-http://hip-patient-service:8002}
      - BED_SERVICE_URL=${BED_SERVICE_URL:-http://hip-bed-service:8003}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- AUTHENTICATION SERVICE ---
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hip-auth-service
    ports:
      - "8001:8001"
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- PATIENT SERVICE ---
  patient-service:
    build: ./services/patient-service
    container_name: hip-patient-service
    ports:
      - "8002:8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BED_SERVICE_URL=${BED_SERVICE_URL:-http://hip-bed-service:8003}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- BED SERVICE ---
  bed-service:
    build: ./services/bed-service
    container_name: hip-bed-service
    ports:
      - "8003:8003"
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://hip-redis:6379}
      - PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:-http://hip-patient-service:8002}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    networks:
      - hip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- DATABASE PERSISTENCE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: hip-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  # --- CACHING / SESSION LAYER ---
  redis:
    image: redis:7-alpine
    container_name: hip-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - hip-network
