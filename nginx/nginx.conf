# =================================================================
# HIP Production Edge Proxy — Rate Limiting, DDoS Mitigation & TLS
# =================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide exact Nginx version
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # --- Slowloris, Slow-POST & Slow-Read Protections ---
    client_body_timeout           10s;
    client_header_timeout         10s;
    send_timeout                  15s;
    keepalive_timeout             30s;
    keepalive_requests            1000;
    reset_timedout_connection     on;

    # --- Payload & Header Memory Exhaustion Guards ---
    client_max_body_size          1m;
    client_body_buffer_size       16k;
    client_header_buffer_size     2k;
    large_client_header_buffers   2 8k;

    # --- Optional CDN / Load Balancer Real-IP Extraction ---
    # Uncomment and restrict to your actual Cloudflare / AWS ALB CIDRs when deploying behind a proxy:
    # set_real_ip_from  173.245.48.0/20;
    # set_real_ip_from  103.21.244.0/22;
    # real_ip_header    CF-Connecting-IP;
    # real_ip_recursive on;

    # --- Upstream Connection Upgrade Map (HTTP keepalive + WebSocket) ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # --- Rate Limiting & Concurrent Connection Zones (Per Client IP) ---
    # 10m shared memory holds ~160,000 IP state entries
    limit_req_zone  $binary_remote_addr zone=api_general:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_strict:10m   rate=15r/m;
    limit_req_zone  $binary_remote_addr zone=ai_limit:10m      rate=12r/m;
    limit_req_zone  $binary_remote_addr zone=ws_handshake:10m  rate=10r/m;

    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # --- Default Upstream Timeouts (overridden per-route for AI / WebSockets) ---
    proxy_send_timeout            30s;
    proxy_read_timeout            30s;

    # --- Upstream API Gateway Connection Pool ---
    upstream hip_gateway {
        server hip-gateway:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
